name: Test TrainMeet Server

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install Mosquitto
        run: sudo apt-get update && sudo apt-get install -y mosquitto
      - name: Install server
        run: python -m pip install -e '.[mqtt]'
      - name: Run tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Test localization, Cloud-only shell and US browser behavior
        run: node --test tests/js/i18n.test.cjs tests/js/i18n-coverage.test.cjs tests/js/shell-i18n.test.cjs tests/js/us-ui.test.cjs tests/js/tmbox-catalog.test.cjs tests/js/tmbox-cloud-config.test.cjs tests/js/terminal16-buffer.test.cjs tests/js/terminal16-guard.test.cjs tests/js/live-events.test.cjs tests/js/display-feed.test.cjs tests/js/train-live.test.cjs tests/js/terminal16-timetable.test.cjs tests/js/day-change.test.cjs tests/js/clock-face.test.cjs
      - name: Install isolated browser test runtime
        run: npm install --no-save --package-lock=false playwright@1.55.0 && npx playwright install --with-deps chromium
      - name: Verify desktop/mobile dialogs and public client assignment
        run: |
          node tests/js/server-shell.test.cjs
          node tests/js/setup-finish.test.cjs
          node tests/js/server-shell-live.test.cjs
          node tests/js/public-workspaces-live.test.cjs
          node tests/js/terminal16-placement-live.test.cjs
          node tests/js/restore-last.test.cjs
          node tests/js/meet-reset-live.test.cjs
          node tests/js/tmbox-wake-live.test.cjs
          node tests/js/tmbox-timetable-live.test.cjs
          node tests/js/meet-country-live.test.cjs
          node tests/js/drift-station-list.test.cjs
          node tests/js/login-look.test.cjs
          node tests/js/admin-start.test.cjs
          node tests/js/participant-desktop.test.cjs
          node tests/js/account-mail-live.test.cjs
          node tests/js/header-mobile.test.cjs
          node tests/js/software-retry.test.cjs
          node tests/js/data-page.test.cjs
          node tests/js/topology-rails.test.cjs
          node tests/js/overview-run.test.cjs
          node tests/js/server-unreachable.test.cjs
          node tests/js/live-timetable.test.cjs
          node tests/js/meet-calendar.test.cjs
          node tests/js/double-track-meet.test.cjs
          node tests/js/clock-faces-live.test.cjs
          node tests/js/station-automatic-live.test.cjs
