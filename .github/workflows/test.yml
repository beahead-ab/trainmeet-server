name: Test TrainMeet Server

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install Mosquitto
        run: sudo apt-get update && sudo apt-get install -y mosquitto
      - name: Install server
        run: python -m pip install -e '.[mqtt]'
      - name: Run tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Test localization, Cloud-only shell and US browser behavior
        run: node --test tests/js/i18n.test.cjs tests/js/shell-i18n.test.cjs tests/js/us-ui.test.cjs tests/js/tmbox-catalog.test.cjs tests/js/tmbox-cloud-config.test.cjs
      - name: Install isolated browser test runtime
        run: npm install --no-save --package-lock=false playwright@1.55.0 && npx playwright install --with-deps chromium
      - name: Verify desktop/mobile dialogs and public client assignment
        run: |
          node tests/js/server-shell.test.cjs
          node tests/js/server-shell-live.test.cjs
          node tests/js/public-workspaces-live.test.cjs
