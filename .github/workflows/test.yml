name: Test TrainMeet Server

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install Mosquitto
        run: sudo apt-get update && sudo apt-get install -y mosquitto
      - name: Install server
        run: python -m pip install -e '.[mqtt]'
      - name: Run tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Test localization and US browser behavior
        run: node --test tests/js/i18n.test.cjs tests/js/us-ui.test.cjs
