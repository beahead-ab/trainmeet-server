name: Build portable server image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_ref:
        description: 'Existing version tag to test and publish (vX.Y.Z)'
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.release.outputs.ref }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: release
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            [[ "$RELEASE_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            SHA=$(git rev-parse "refs/tags/$RELEASE_REF^{commit}")
            VERSION=$(git show "$SHA:VERSION" | tr -d '\r\n')
            test "v$VERSION" = "$RELEASE_REF"
            echo "ref=$SHA" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi
  test-container:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.ref }}
      - name: Build and start local stack
        run: docker compose up --build --detach
      - name: Wait for TrainMeet Server
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8787/v1/info; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Stop local stack
        if: always()
        run: docker compose down --volumes

  lint-helm:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.ref }}
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/trainmeet-server
      - run: helm template test deploy/helm/trainmeet-server > /dev/null

  publish:
    if: github.event_name != 'pull_request'
    needs: [resolve, test-container, lint-helm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.ref }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/beahead-ab/trainmeet-server
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ needs.resolve.outputs.version }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=main,enable=${{ github.event_name == 'workflow_dispatch' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
