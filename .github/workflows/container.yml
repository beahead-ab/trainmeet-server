name: Build portable server image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build and start local stack
        run: docker compose up --build --detach
      - name: Wait for TrainMeet Server
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8787/v1/info; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Stop local stack
        if: always()
        run: docker compose down --volumes

  lint-helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/trainmeet-server
      - run: helm template test deploy/helm/trainmeet-server > /dev/null

  publish:
    if: github.event_name != 'pull_request'
    needs: [test-container, lint-helm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/beahead-ab/trainmeet-server
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

