[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "trainmeet-server"
version = "1.3.0"
description = "Local TrainMeet Server and server-authoritative TMBox runtime for Raspberry Pi"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
mqtt = ["paho-mqtt>=2.1,<3"]

[project.scripts]
trainmeet-server = "tmbox_gateway.local_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tmbox_gateway = ["web/*.html", "web/*.css", "web/*.js", "web/*.png", "tkl/*", "tkl/assets/*"]
