image:
  repository: ghcr.io/beahead-ab/trainmeet-server
  tag: "0.5.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

server:
  gatewayId: ""
  centralRuntimeUrl: ""
  # Without hostNetwork the pod only sees the cluster's internal network, so a
  # TMBox cannot be told where to connect without this: the IP or domain
  # other devices actually use to reach the cluster (e.g. an Ingress host or
  # LoadBalancer address). Not needed when hostNetwork is true.
  advertisedHost: ""
  hostNetwork: false
  forceExternalAuth: false
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 500m
      memory: 256Mi

mosquitto:
  image:
    repository: eclipse-mosquitto
    tag: "2.0"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi

service:
  type: ClusterIP
  annotations: {}
  httpPort: 8787
  mqttPort: 1883

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: trainmeet.example.local
  tls: []

persistence:
  storageClass: ""
  server:
    size: 1Gi
  mqtt:
    size: 256Mi

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
