apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "trainmeet-server.fullname" . }}-mosquitto
  labels:
    {{- include "trainmeet-server.labels" . | nindent 4 }}
data:
  mosquitto.conf: |
    listener 1883 0.0.0.0
    allow_anonymous true
    persistence true
    persistence_location /mosquitto/data/
    autosave_interval 10
    log_dest stdout
    log_type warning
    log_type error

