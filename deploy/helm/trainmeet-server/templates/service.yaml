apiVersion: v1
kind: Service
metadata:
  name: {{ include "trainmeet-server.fullname" . }}
  labels:
    {{- include "trainmeet-server.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "trainmeet-server.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.httpPort }}
      targetPort: http
      protocol: TCP
    - name: mqtt
      port: {{ .Values.service.mqttPort }}
      targetPort: mqtt
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "trainmeet-server.fullname" . }}-headless
  labels:
    {{- include "trainmeet-server.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "trainmeet-server.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.httpPort }}
      targetPort: http

