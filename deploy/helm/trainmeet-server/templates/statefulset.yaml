apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "trainmeet-server.fullname" . }}
  labels:
    {{- include "trainmeet-server.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "trainmeet-server.fullname" . }}-headless
  replicas: 1
  selector:
    matchLabels:
      {{- include "trainmeet-server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "trainmeet-server.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      hostNetwork: {{ .Values.server.hostNetwork }}
      {{- if .Values.server.hostNetwork }}
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      terminationGracePeriodSeconds: 20
      initContainers:
        - name: prepare-volumes
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 10001:10001 /server-data && chown -R 1883:1883 /mqtt-data"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: server-data
              mountPath: /server-data
            - name: mqtt-data
              mountPath: /mqtt-data
      containers:
        - name: server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --external-broker
            - --mqtt-host
            - 127.0.0.1
            - --bind
            - 0.0.0.0
            - --state-dir
            - /var/lib/trainmeet-server
            {{- if or .Values.server.forceExternalAuth .Values.ingress.enabled }}
            - --force-external-auth
            {{- end }}
            {{- if .Values.server.gatewayId }}
            - --gateway-id
            - {{ .Values.server.gatewayId | quote }}
            {{- end }}
          {{- if .Values.server.centralRuntimeUrl }}
          env:
            - name: TRAINMEET_RUNTIME_URL
              value: {{ .Values.server.centralRuntimeUrl | quote }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8787
          readinessProbe:
            httpGet:
              path: /v1/info
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /v1/info
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
          volumeMounts:
            - name: server-data
              mountPath: /var/lib/trainmeet-server
        - name: mosquitto
          image: "{{ .Values.mosquitto.image.repository }}:{{ .Values.mosquitto.image.tag }}"
          imagePullPolicy: {{ .Values.mosquitto.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1883
            runAsGroup: 1883
            capabilities:
              drop: ["ALL"]
          ports:
            - name: mqtt
              containerPort: 1883
          readinessProbe:
            tcpSocket:
              port: mqtt
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: mqtt
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.mosquitto.resources | nindent 12 }}
          volumeMounts:
            - name: mosquitto-config
              mountPath: /mosquitto/config/mosquitto.conf
              subPath: mosquitto.conf
              readOnly: true
            - name: mqtt-data
              mountPath: /mosquitto/data
      volumes:
        - name: mosquitto-config
          configMap:
            name: {{ include "trainmeet-server.fullname" . }}-mosquitto
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: server-data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.server.size }}
    - metadata:
        name: mqtt-data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.mqtt.size }}
