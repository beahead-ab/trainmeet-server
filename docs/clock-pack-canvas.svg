<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 560 285" width="840" height="428" font-family="Inter, Helvetica, Arial, sans-serif" font-size="9">
  <title>Mallen för ett klockpaket: en kvadrat 200 × 200 med vridpunkten i mitten</title>
  <rect x="-10" y="-10" width="560" height="285" fill="#ffffff"/>
  <!-- Vänster: hela ytan med tavlan -->
  <g transform="translate(10 40)">
    <text x="100" y="-22" text-anchor="middle" font-size="11" font-weight="700" fill="#16181c">dial.svg: tavlan</text>
    <rect x="0" y="0" width="200" height="200" fill="none" stroke="#9aa1ab" stroke-dasharray="4 3"/>
    <text x="0" y="-6" fill="#6b7280">0,0</text>
    <text x="200" y="212" text-anchor="end" fill="#6b7280">200,200</text>
    <circle cx="100" cy="100" r="98" fill="#f4f5f7" stroke="#16181c" stroke-width="2"/>
    <circle cx="100" cy="100" r="88" fill="none" stroke="#1f5fbf" stroke-width="1" stroke-dasharray="3 3"/>
    <g fill="#16181c">
      <rect x="97" y="12" width="6" height="18"/>
      <rect x="97" y="12" width="6" height="18" transform="rotate(90 100 100)"/>
      <rect x="97" y="12" width="6" height="18" transform="rotate(180 100 100)"/>
      <rect x="97" y="12" width="6" height="18" transform="rotate(270 100 100)"/>
    </g>
    <path d="M95 100 H105 M100 95 V105" stroke="#c0262d" stroke-width="1.5"/>
    <text x="108" y="114" fill="#c0262d">vridpunkt 100,100</text>
    <text x="100" y="58" text-anchor="middle" fill="#1f5fbf">streck och siffror</text>
    <text x="100" y="68" text-anchor="middle" fill="#1f5fbf">innanför 88</text>
    <text x="100" y="160" text-anchor="middle" fill="#16181c">kanten högst 98 från mitten</text>
    <text x="3" y="9" font-size="8" fill="#6b7280">genomskinligt</text>
  </g>
  <!-- Mitten: en visare -->
  <g transform="translate(250 40)">
    <text x="100" y="-22" text-anchor="middle" font-size="11" font-weight="700" fill="#16181c">minute.svg: en visare</text>
    <rect x="0" y="0" width="200" height="200" fill="none" stroke="#9aa1ab" stroke-dasharray="4 3"/>
    <circle cx="100" cy="100" r="98" fill="none" stroke="#c9ced6" stroke-dasharray="2 3"/>
    <rect x="97" y="22" width="6" height="96" fill="#16181c"/>
    <path d="M95 100 H105 M100 95 V105" stroke="#c0262d" stroke-width="1.5"/>
    <path d="M118 22 H140 M118 100 H140 M118 118 H140" stroke="#6b7280" stroke-width=".7"/>
    <path d="M136 22 V100" stroke="#6b7280" stroke-width=".7"/>
    <text x="142" y="64" fill="#16181c">längd</text>
    <text x="142" y="74" fill="#16181c">78 (minut)</text>
    <text x="142" y="122" fill="#16181c">svans 18</text>
    <text x="100" y="14" text-anchor="middle" fill="#16181c">pekar rakt upp mot 12</text>
    <text x="100" y="160" text-anchor="middle" fill="#6b7280">resten av ytan genomskinlig</text>
    <text x="100" y="170" text-anchor="middle" fill="#6b7280">samma viewBox som tavlan</text>
  </g>
  <!-- Höger: lagren på varandra -->
  <g transform="translate(470 40)">
    <text x="30" y="-22" text-anchor="middle" font-size="11" font-weight="700" fill="#16181c">på skärmen</text>
    <g fill="none" stroke="#16181c">
      <rect x="0" y="20" width="60" height="16" rx="2" fill="#f4f5f7"/><text x="30" y="31" text-anchor="middle" stroke="none" fill="#16181c">top</text>
      <rect x="0" y="40" width="60" height="16" rx="2" fill="#f4f5f7"/><text x="30" y="51" text-anchor="middle" stroke="none" fill="#16181c">second</text>
      <rect x="0" y="60" width="60" height="16" rx="2" fill="#f4f5f7"/><text x="30" y="71" text-anchor="middle" stroke="none" fill="#16181c">minute</text>
      <rect x="0" y="80" width="60" height="16" rx="2" fill="#f4f5f7"/><text x="30" y="91" text-anchor="middle" stroke="none" fill="#16181c">hour</text>
      <rect x="0" y="100" width="60" height="16" rx="2" fill="#f4f5f7"/><text x="30" y="111" text-anchor="middle" stroke="none" fill="#16181c">dial</text>
    </g>
    <text x="30" y="136" text-anchor="middle" fill="#6b7280">överst</text>
    <text x="30" y="146" text-anchor="middle" fill="#6b7280">till underst</text>
    <text x="30" y="166" text-anchor="middle" fill="#6b7280">visarna vrids</text>
    <text x="30" y="176" text-anchor="middle" fill="#6b7280">kring 100,100</text>
  </g>
  <text x="270" y="268" text-anchor="middle" fill="#6b7280">Måtten gäller viewBox 0 0 200 200. Med en annan kvadrat skalas allt i samma proportion.</text>
</svg>
