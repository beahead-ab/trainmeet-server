arning.</text><text x="54" y="801" font-family="Inter,Arial,Helvetica,sans-serif" fill="#a5b0bf" font-size="13" font-weight="400" text-anchor="start">FÖRBILD: TMBox iPhone / TimetableView.swift  ·  Nu-linjen passerar även tågtursgränser och växlingsmoment.</text><text x="54" y="823" font-family="Inter,Arial,Helvetica,sans-serif" fill="#7c8795" font-size="12" font-weight="400" text-anchor="start">TEST: 1× / 4× / paus / fel / tidshopp / midnatt / scroll.  ÄR EN DESIGNSKISS, INTE KÖRKLAR KOD.</text></svg>